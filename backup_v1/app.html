<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CS2 Tactics Lab</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Tactical Rajdhani & Chakra Petch -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700;800&family=Rajdhani:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- React 18 & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            csdark: {
              950: '#09090b',
              900: '#111114',
              850: '#16161a',
              800: '#1d1d23',
              700: '#2a2a33',
              600: '#3d3d4a',
            },
            cslight: {
              50: '#f8fafc',
              100: '#f1f5f9',
              200: '#e2e8f0',
              300: '#cbd5e1',
              800: '#1e293b',
              900: '#0f172a',
            },
            csorange: {
              DEFAULT: '#f59e0b',
              light: '#fbbf24',
              dark: '#d97706',
              neon: '#ff7a00',
            },
            csterror: '#f59e0b',
            csct: '#38bdf8',
          },
          fontFamily: {
            tactical: ['Chakra Petch', 'Rajdhani', 'sans-serif'],
            sans: ['Rajdhani', 'sans-serif'],
          },
          boxShadow: {
            'glow-orange': '0 0 25px -2px rgba(245, 158, 11, 0.45)',
            'glow-ct': '0 0 25px -2px rgba(56, 189, 248, 0.45)',
          }
        }
      }
    };
  </script>

  <style>
    body {
      font-family: 'Rajdhani', sans-serif;
      user-select: none;
      overflow-x: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Radar Entrance Animation */
    @keyframes mapReveal {
      0% {
        opacity: 0;
        transform: scale(0.92) translateY(20px);
        filter: blur(6px) brightness(1.4);
      }
      60% {
        opacity: 0.95;
        transform: scale(1.01) translateY(-2px);
        filter: blur(0px) brightness(1.1);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
        filter: brightness(1);
      }
    }

    .animate-map-reveal {
      animation: mapReveal 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeInScale {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .animate-team-select {
      animation: fadeInScale 0.35s ease-out forwards;
    }
  </style>
</head>
<body class="bg-cslight-100 text-cslight-900 dark:bg-csdark-950 dark:text-gray-100 min-h-screen flex flex-col">
  <div id="root" class="flex-1 flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // MAP POOL IN 2 COLUMNS (CS2 STYLE)
    const MAP_COLUMNS = [
      // Left Column
      [
        {
          id: 'mirage',
          name: 'MIRAGE',
          image: 'https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=600&q=80',
          active: true,
          badge: 'ДОСТУПНО',
          desc: 'Нажмите для входа ➜',
        },
        {
          id: 'inferno',
          name: 'INFERNO',
          image: 'https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=600&q=80',
          active: false,
          badge: 'В РАЗРАБОТКЕ',
          desc: 'Скоро в пуле',
        },
        {
          id: 'nuke',
          name: 'NUKE',
          image: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=600&q=80',
          active: false,
          badge: 'В РАЗРАБОТКЕ',
          desc: 'Скоро в пуле',
        },
        {
          id: 'dust2',
          name: 'DUST II',
          image: 'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=600&q=80',
          active: false,
          badge: 'В РАЗРАБОТКЕ',
          desc: 'Скоро в пуле',
        },
      ],
      // Right Column
      [
        {
          id: 'ancient',
          name: 'ANCIENT',
          image: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=600&q=80',
          active: false,
          badge: 'В РАЗРАБОТКЕ',
          desc: 'Скоро в пуле',
        },
        {
          id: 'anubis',
          name: 'ANUBIS',
          image: 'https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?auto=format&fit=crop&w=600&q=80',
          active: false,
          badge: 'В РАЗРАБОТКЕ',
          desc: 'Скоро в пуле',
        },
        {
          id: 'vertigo',
          name: 'VERTIGO',
          image: 'https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?auto=format&fit=crop&w=600&q=80',
          active: false,
          badge: 'В РАЗРАБОТКЕ',
          desc: 'Скоро в пуле',
        },
        {
          id: 'overpass',
          name: 'OVERPASS',
          image: 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=600&q=80',
          active: false,
          badge: 'В РАЗРАБОТКЕ',
          desc: 'Скоро в пуле',
        },
      ]
    ];

    function App() {
      // Screens: 'select-map' -> 'select-team' -> 'map-view'
      const [currentView, setCurrentView] = useState('select-map');
      const [selectedTeam, setSelectedTeam] = useState('T'); // 'T' or 'CT'
      const [lockedNotice, setLockedNotice] = useState(null);

      // Light / Dark Theme State
      const [isDark, setIsDark] = useState(() => {
        const saved = localStorage.getItem('cs2_theme');
        return saved ? saved === 'dark' : true;
      });

      // Synchronize <html> class with theme
      useEffect(() => {
        const html = document.documentElement;
        if (isDark) {
          html.classList.add('dark');
          localStorage.setItem('cs2_theme', 'dark');
        } else {
          html.classList.remove('dark');
          localStorage.setItem('cs2_theme', 'light');
        }
      }, [isDark]);

      // Toggle Theme function
      const toggleTheme = () => {
        setIsDark(prev => !prev);
      };

      // Handler when user picks Mirage
      const handleSelectMap = (map) => {
        if (!map.active) {
          setLockedNotice(`Карта ${map.name} в разработке. Доступен Mirage!`);
          setTimeout(() => setLockedNotice(null), 2500);
          return;
        }
        // Step 2: Show team selection for Mirage!
        setCurrentView('select-team');
      };

      // Handler when user picks team (T or CT)
      const handlePickTeam = (team) => {
        setSelectedTeam(team);
        setCurrentView('map-view');
      };

      // Quick Switch Team from Map screen (without reload)
      const handleSwitchTeam = () => {
        setSelectedTeam(prev => (prev === 'T' ? 'CT' : 'T'));
      };

      return (
        <div className="flex-1 flex flex-col">
          {/* ======================================================== */}
          {/* GLOBAL TACTICAL HEADER                                   */}
          {/* ======================================================== */}
          <header className="sticky top-0 z-40 bg-white/90 border-cslight-200 dark:bg-csdark-950/90 dark:border-csdark-800 backdrop-blur-md border-b px-4 py-3 transition-colors">
            <div className="max-w-6xl mx-auto flex items-center justify-between">
              {/* Logo & Title */}
              <div className="flex items-center gap-2.5">
                <div className="w-9 h-9 rounded-lg bg-gradient-to-br from-csorange to-amber-600 flex items-center justify-center shadow-glow-orange text-black font-extrabold font-tactical text-lg tracking-wider">
                  CS2
                </div>
                <div>
                  <div className="flex items-center gap-1.5">
                    <h1 className="text-base font-extrabold uppercase tracking-wider text-cslight-900 dark:text-white font-tactical leading-none">
                      Tactics Lab
                    </h1>
                    <span className="text-[10px] font-bold bg-csorange/20 text-csorange border border-csorange/40 px-1.5 py-0.5 rounded font-mono">
                      SUBTICK
                    </span>
                  </div>
                  <p className="text-[11px] text-gray-500 dark:text-gray-400 uppercase tracking-widest font-mono">
                    {currentView === 'select-map' ? 'Выбор карты' : currentView === 'select-team' ? 'Выбор стороны' : `MIRAGE // ${selectedTeam === 'T' ? 'ТЕРРОРИСТЫ (T)' : 'СПЕЦНАЗ (CT)'}`}
                  </p>
                </div>
              </div>

              {/* Header Right Actions: Team Switcher & Theme Toggle */}
              <div className="flex items-center gap-2">
                {/* Team Switcher in Header (Available in Map View) */}
                {currentView === 'map-view' && (
                  <button
                    onClick={handleSwitchTeam}
                    title="Сменить команду (T / CT)"
                    className={`px-3 py-1.5 rounded-xl text-xs font-bold font-mono uppercase tracking-wider border flex items-center gap-1.5 transition-all shadow-sm active:scale-95 ${
                      selectedTeam === 'T'
                        ? 'bg-amber-500/15 border-amber-500/60 text-amber-600 dark:text-csterror shadow-glow-orange'
                        : 'bg-sky-500/15 border-sky-500/60 text-sky-600 dark:text-csct shadow-glow-ct'
                    }`}
                  >
                    <span>{selectedTeam === 'T' ? '🔶 T (Атака)' : '🔷 CT (Защита)'}</span>
                    <span className="text-[10px] opacity-75 font-sans">⇄ Сменить</span>
                  </button>
                )}

                {/* Back to maps button (if not on main screen) */}
                {currentView !== 'select-map' && (
                  <button
                    onClick={() => setCurrentView('select-map')}
                    className="px-3 py-1.5 rounded-xl bg-cslight-200 hover:bg-cslight-300 dark:bg-csdark-850 dark:hover:bg-csdark-800 border border-cslight-300 dark:border-csdark-700 text-xs font-bold text-gray-700 dark:text-gray-200 hover:text-csorange transition-all flex items-center gap-1 active:scale-95"
                  >
                    <span>⬅</span>
                    <span className="font-mono uppercase tracking-wider hidden sm:inline">К картам</span>
                  </button>
                )}

                {/* Light / Dark Theme Switcher Button */}
                <button
                  onClick={toggleTheme}
                  title={isDark ? 'Включить светлую тему' : 'Включить темную тему'}
                  className="w-9 h-9 rounded-xl bg-cslight-200 hover:bg-cslight-300 dark:bg-csdark-850 dark:hover:bg-csdark-800 border border-cslight-300 dark:border-csdark-700 flex items-center justify-center text-sm font-bold transition-all shadow-sm active:scale-90"
                >
                  {isDark ? '☀️' : '🌙'}
                </button>
              </div>
            </div>
          </header>

          {/* ======================================================== */}
          {/* MAIN VIEW CONTENT                                        */}
          {/* ======================================================== */}
          <main className="flex-1 flex flex-col justify-center max-w-6xl w-full mx-auto p-4 sm:p-6">

            {/* -------------------------------------------------------- */}
            {/* 1. MAP SELECTION SCREEN (2 COLUMNS AS IN CS2)            */}
            {/* -------------------------------------------------------- */}
            {currentView === 'select-map' && (
              <div className="space-y-6 animate-fade-in py-2">
                <div className="text-center space-y-1">
                  <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-csorange/10 border border-csorange/30 text-csorange text-xs font-mono font-bold tracking-widest uppercase">
                    <span className="w-2 h-2 rounded-full bg-csorange animate-ping" />
                    CS2 MAP POOL
                  </div>
                  <h2 className="text-2xl sm:text-3xl font-extrabold text-cslight-900 dark:text-white uppercase font-tactical tracking-wider">
                    ВЫБЕРИТЕ КАРТУ
                  </h2>
                </div>

                {lockedNotice && (
                  <div className="max-w-md mx-auto p-2.5 rounded-xl bg-amber-500/10 border border-amber-500/40 text-amber-500 dark:text-amber-300 text-xs text-center font-mono animate-bounce">
                    🔒 {lockedNotice}
                  </div>
                )}

                {/* 2 Columns of maps */}
                <div className="grid grid-cols-2 gap-3.5 max-w-2xl mx-auto">
                  <div className="space-y-3">
                    {MAP_COLUMNS[0].map(map => (
                      <MapCard key={map.id} map={map} onSelect={handleSelectMap} />
                    ))}
                  </div>

                  <div className="space-y-3">
                    {MAP_COLUMNS[1].map(map => (
                      <MapCard key={map.id} map={map} onSelect={handleSelectMap} />
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* -------------------------------------------------------- */}
            {/* 2. TEAM SELECTION STEP (AFTER PICKING MAP)               */}
            {/* -------------------------------------------------------- */}
            {currentView === 'select-team' && (
              <div className="space-y-6 animate-team-select max-w-xl mx-auto w-full py-4">
                <div className="text-center space-y-1">
                  <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-csorange/10 border border-csorange/30 text-csorange text-xs font-mono font-bold tracking-widest uppercase">
                    DE_MIRAGE // CS2
                  </div>
                  <h2 className="text-2xl sm:text-3xl font-extrabold text-cslight-900 dark:text-white uppercase font-tactical tracking-wider">
                    ВЫБЕРИТЕ КОМАНДУ
                  </h2>
                  <p className="text-xs text-gray-500 dark:text-gray-400 font-mono">
                    За какую сторону вы будете играть в этом матче?
                  </p>
                </div>

                {/* Two Large Team Pick Cards */}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  {/* T-Side Card */}
                  <button
                    onClick={() => handlePickTeam('T')}
                    className="p-5 rounded-2xl border-2 border-amber-500/60 bg-amber-500/5 hover:bg-amber-500/15 hover:border-amber-500 text-left transition-all duration-200 group shadow-glow-orange active:scale-95 flex flex-col justify-between h-48"
                  >
                    <div>
                      <div className="flex items-center justify-between mb-2">
                        <span className="w-10 h-10 rounded-xl bg-amber-500/20 text-csterror flex items-center justify-center font-tactical font-black text-xl">
                          T
                        </span>
                        <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-amber-500 text-black uppercase font-mono">
                          АТАКА
                        </span>
                      </div>
                      <h3 className="text-xl font-extrabold uppercase font-tactical text-amber-500">
                        ТЕРРОРИСТЫ
                      </h3>
                      <p className="text-xs text-gray-500 dark:text-gray-300 mt-1 font-mono leading-relaxed">
                        Выходы на Пленты A и B, сплиты через Мид, занятие позиций.
                      </p>
                    </div>

                    <div className="text-xs font-bold text-amber-500 flex items-center gap-1 group-hover:translate-x-1 transition-transform">
                      <span>Выбрать Террористов</span>
                      <span>➜</span>
                    </div>
                  </button>

                  {/* CT-Side Card */}
                  <button
                    onClick={() => handlePickTeam('CT')}
                    className="p-5 rounded-2xl border-2 border-sky-500/60 bg-sky-500/5 hover:bg-sky-500/15 hover:border-sky-500 text-left transition-all duration-200 group shadow-glow-ct active:scale-95 flex flex-col justify-between h-48"
                  >
                    <div>
                      <div className="flex items-center justify-between mb-2">
                        <span className="w-10 h-10 rounded-xl bg-sky-500/20 text-csct flex items-center justify-center font-tactical font-black text-xl">
                          CT
                        </span>
                        <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-sky-500 text-black uppercase font-mono">
                          ЗАЩИТА
                        </span>
                      </div>
                      <h3 className="text-xl font-extrabold uppercase font-tactical text-sky-500">
                        СПЕЦНАЗ
                      </h3>
                      <p className="text-xs text-gray-500 dark:text-gray-300 mt-1 font-mono leading-relaxed">
                        Удержание опорных точек, контр-раскидки, выбивание сайтов (ретейки).
                      </p>
                    </div>

                    <div className="text-xs font-bold text-sky-500 flex items-center gap-1 group-hover:translate-x-1 transition-transform">
                      <span>Выбрать Спецназ</span>
                      <span>➜</span>
                    </div>
                  </button>
                </div>

                <div className="text-center pt-2">
                  <button
                    onClick={() => setCurrentView('select-map')}
                    className="text-xs font-mono text-gray-400 hover:text-csorange transition-colors"
                  >
                    ⬅ Вернуться к выбору карты
                  </button>
                </div>
              </div>
            )}

            {/* -------------------------------------------------------- */}
            {/* 3. MIRAGE MAP SCREEN (LARGE, CLEAN, WITH TEAM BAR)       */}
            {/* -------------------------------------------------------- */}
            {currentView === 'map-view' && (
              <div className="space-y-3 animate-map-reveal w-full flex flex-col items-center">
                {/* Header bar on Map Screen */}
                <div className="w-full flex items-center justify-between pb-1">
                  <button
                    onClick={() => setCurrentView('select-map')}
                    className="px-4 py-2 rounded-xl bg-white dark:bg-csdark-900 hover:bg-cslight-200 dark:hover:bg-csdark-850 border border-cslight-300 dark:border-csdark-700 text-xs font-bold text-gray-700 dark:text-gray-300 hover:text-csorange transition-all flex items-center gap-2 active:scale-95 shadow-sm"
                  >
                    <span>⬅</span>
                    <span className="font-mono uppercase tracking-wider">К картам</span>
                  </button>

                  <div className="flex items-center gap-2">
                    <h2 className="text-xl sm:text-2xl font-extrabold uppercase font-tactical text-cslight-900 dark:text-white tracking-widest">
                      MIRAGE
                    </h2>
                    <span className={`px-2 py-0.5 rounded text-[10px] font-bold font-mono uppercase border ${
                      selectedTeam === 'T'
                        ? 'bg-amber-500/15 border-amber-500 text-amber-600 dark:text-amber-400'
                        : 'bg-sky-500/15 border-sky-500 text-sky-600 dark:text-sky-400'
                    }`}>
                      {selectedTeam === 'T' ? 'T - Атака' : 'CT - Защита'}
                    </span>
                  </div>

                  {/* Quick Team Toggle button */}
                  <button
                    onClick={handleSwitchTeam}
                    className={`px-3 py-1.5 rounded-xl text-xs font-bold font-mono uppercase tracking-wider border flex items-center gap-1.5 transition-all shadow-sm active:scale-95 ${
                      selectedTeam === 'T'
                        ? 'bg-amber-500/15 border-amber-500/60 text-amber-600 dark:text-csterror hover:bg-amber-500/25'
                        : 'bg-sky-500/15 border-sky-500/60 text-sky-600 dark:text-csct hover:bg-sky-500/25'
                    }`}
                  >
                    <span>⇄</span>
                    <span>Сменить на {selectedTeam === 'T' ? 'CT' : 'T'}</span>
                  </button>
                </div>

                {/* LARGE RADAR IMAGE — PURE & SCALED */}
                <div className="w-full flex items-center justify-center">
                  <img
                    src="media/mirage_radar.jpg"
                    alt="Карта Mirage"
                    className="w-full max-h-[82vh] object-contain rounded-2xl drop-shadow-[0_0_40px_rgba(0,0,0,0.85)]"
                  />
                </div>
              </div>
            )}

          </main>
        </div>
      );
    }

    // 2-COLUMN MAP CARD COMPONENT
    function MapCard({ map, onSelect }) {
      return (
        <button
          onClick={() => onSelect(map)}
          className={`w-full text-left relative rounded-2xl overflow-hidden transition-all duration-200 border h-28 ${
            map.active
              ? 'border-csorange ring-1 ring-csorange/50 shadow-glow-orange hover:scale-[1.02] cursor-pointer'
              : 'border-cslight-300 dark:border-csdark-800 opacity-50 grayscale cursor-not-allowed'
          }`}
        >
          <img
            src={map.image}
            alt={map.name}
            className="absolute inset-0 w-full h-full object-cover transition-transform duration-300"
          />

          <div
            className={`absolute inset-0 ${
              map.active
                ? 'bg-gradient-to-t from-black via-black/60 to-black/20'
                : 'bg-gradient-to-t from-black via-black/80 to-black/60'
            }`}
          />

          <div className="absolute top-2.5 right-2.5">
            {map.active ? (
              <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-csorange text-black font-mono shadow-md">
                <span className="w-1.5 h-1.5 rounded-full bg-black animate-pulse" />
                {map.badge}
              </span>
            ) : (
              <span className="inline-flex items-center gap-1 px-1.5 py-0.5 rounded text-[9px] font-bold bg-black/80 text-gray-400 border border-csdark-700 font-mono">
                🔒 {map.badge}
              </span>
            )}
          </div>

          <div className="absolute bottom-2.5 left-3">
            <h3 className="text-base sm:text-lg font-extrabold text-white uppercase font-tactical tracking-wide drop-shadow-md leading-tight">
              {map.name}
            </h3>
            <p className="text-[11px] font-mono text-gray-300 drop-shadow">
              {map.desc}
            </p>
          </div>

          {map.active && (
            <div className="absolute bottom-0 inset-x-0 h-1 bg-gradient-to-r from-csorange to-amber-500" />
          )}
        </button>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
